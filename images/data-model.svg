<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 580" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="es" x="-2%" y="-2%" width="104%" height="108%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.08"/>
    </filter>
  </defs>

  <rect width="960" height="580" rx="16" fill="#f8fafc"/>
  <text x="480" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Modele de Donnees - Entites Principales</text>

  <!-- USER -->
  <g filter="url(#es)">
    <rect x="30" y="60" width="200" height="210" rx="10" fill="white" stroke="#3b82f6" stroke-width="2"/>
    <rect x="30" y="60" width="200" height="32" rx="10" fill="#3b82f6"/>
    <rect x="30" y="78" width="200" height="14" fill="#3b82f6"/>
    <text x="130" y="82" text-anchor="middle" font-size="14" font-weight="800" fill="white">User</text>
    <text x="44" y="112" font-size="11" fill="#334155"><tspan font-weight="700">id</tspan> : UUID</text>
    <text x="44" y="130" font-size="11" fill="#334155">email : varchar(180)</text>
    <text x="44" y="148" font-size="11" fill="#334155">password : varchar</text>
    <text x="44" y="166" font-size="11" fill="#334155">firstName : varchar</text>
    <text x="44" y="184" font-size="11" fill="#334155">lastName : varchar</text>
    <text x="44" y="202" font-size="11" fill="#334155">phone : varchar</text>
    <text x="44" y="220" font-size="11" fill="#334155">role : enum</text>
    <text x="44" y="238" font-size="11" fill="#334155">isActive : boolean</text>
    <text x="44" y="256" font-size="11" fill="#334155">createdAt : datetime</text>
  </g>

  <!-- PRODUCT -->
  <g filter="url(#es)">
    <rect x="30" y="310" width="200" height="250" rx="10" fill="white" stroke="#10b981" stroke-width="2"/>
    <rect x="30" y="310" width="200" height="32" rx="10" fill="#10b981"/>
    <rect x="30" y="328" width="200" height="14" fill="#10b981"/>
    <text x="130" y="332" text-anchor="middle" font-size="14" font-weight="800" fill="white">Product</text>
    <text x="44" y="362" font-size="11" fill="#334155"><tspan font-weight="700">id</tspan> : UUID</text>
    <text x="44" y="380" font-size="11" fill="#334155">title : varchar</text>
    <text x="44" y="398" font-size="11" fill="#334155">description : text</text>
    <text x="44" y="416" font-size="11" fill="#334155">price : decimal (FCFA)</text>
    <text x="44" y="434" font-size="11" fill="#334155">stock : int</text>
    <text x="44" y="452" font-size="11" fill="#334155">slug : varchar (unique)</text>
    <text x="44" y="470" font-size="11" fill="#3b82f6">colors : json []</text>
    <text x="44" y="488" font-size="11" fill="#3b82f6">sizes : json []</text>
    <text x="44" y="506" font-size="11" fill="#334155">averageRating : decimal</text>
    <text x="44" y="524" font-size="11" fill="#64748b">seller : FK User</text>
    <text x="44" y="542" font-size="11" fill="#64748b">category : FK Category</text>
  </g>

  <!-- ORDER -->
  <g filter="url(#es)">
    <rect x="380" y="60" width="200" height="270" rx="10" fill="white" stroke="#f59e0b" stroke-width="2"/>
    <rect x="380" y="60" width="200" height="32" rx="10" fill="#f59e0b"/>
    <rect x="380" y="78" width="200" height="14" fill="#f59e0b"/>
    <text x="480" y="82" text-anchor="middle" font-size="14" font-weight="800" fill="white">Order</text>
    <text x="394" y="112" font-size="11" fill="#334155"><tspan font-weight="700">id</tspan> : UUID</text>
    <text x="394" y="130" font-size="11" fill="#334155">orderNumber : varchar</text>
    <text x="394" y="148" font-size="11" fill="#64748b">user : FK User (acheteur)</text>
    <text x="394" y="166" font-size="11" fill="#64748b">seller : FK User (vendeur)</text>
    <text x="394" y="184" font-size="11" fill="#334155">totalPrice : decimal</text>
    <text x="394" y="202" font-size="11" fill="#334155">shippingCost : decimal</text>
    <text x="394" y="220" font-size="11" fill="#dc2626" font-weight="600">status : enum</text>
    <text x="394" y="238" font-size="11" fill="#f59e0b" font-weight="600">deliveryCode : varchar(6)</text>
    <text x="394" y="256" font-size="11" fill="#334155">stripeSessionId : varchar</text>
    <text x="394" y="274" font-size="11" fill="#334155">shippingAddress : json</text>
    <text x="394" y="292" font-size="11" fill="#334155">paidAt : datetime</text>
    <text x="394" y="310" font-size="11" fill="#334155">createdAt : datetime</text>
  </g>

  <!-- ORDER ITEM -->
  <g filter="url(#es)">
    <rect x="380" y="370" width="200" height="190" rx="10" fill="white" stroke="#d97706" stroke-width="2"/>
    <rect x="380" y="370" width="200" height="32" rx="10" fill="#d97706"/>
    <rect x="380" y="388" width="200" height="14" fill="#d97706"/>
    <text x="480" y="392" text-anchor="middle" font-size="14" font-weight="800" fill="white">OrderItem</text>
    <text x="394" y="422" font-size="11" fill="#334155"><tspan font-weight="700">id</tspan> : UUID</text>
    <text x="394" y="440" font-size="11" fill="#64748b">order : FK Order</text>
    <text x="394" y="458" font-size="11" fill="#64748b">product : FK Product</text>
    <text x="394" y="476" font-size="11" fill="#334155">productTitle : varchar</text>
    <text x="394" y="494" font-size="11" fill="#334155">unitPrice : decimal</text>
    <text x="394" y="512" font-size="11" fill="#334155">quantity : int</text>
    <text x="394" y="530" font-size="11" fill="#3b82f6">selectedColor : varchar</text>
    <text x="394" y="548" font-size="11" fill="#3b82f6">selectedSize : varchar</text>
  </g>

  <!-- CATEGORY -->
  <g filter="url(#es)">
    <rect x="730" y="60" width="200" height="150" rx="10" fill="white" stroke="#8b5cf6" stroke-width="2"/>
    <rect x="730" y="60" width="200" height="32" rx="10" fill="#8b5cf6"/>
    <rect x="730" y="78" width="200" height="14" fill="#8b5cf6"/>
    <text x="830" y="82" text-anchor="middle" font-size="14" font-weight="800" fill="white">Category</text>
    <text x="744" y="112" font-size="11" fill="#334155"><tspan font-weight="700">id</tspan> : UUID</text>
    <text x="744" y="130" font-size="11" fill="#334155">name : varchar</text>
    <text x="744" y="148" font-size="11" fill="#334155">slug : varchar</text>
    <text x="744" y="166" font-size="11" fill="#334155">description : text</text>
    <text x="744" y="184" font-size="11" fill="#64748b">parent : FK self</text>
    <text x="744" y="202" font-size="11" fill="#334155">isActive : boolean</text>
  </g>

  <!-- REVIEW -->
  <g filter="url(#es)">
    <rect x="730" y="240" width="200" height="140" rx="10" fill="white" stroke="#ef4444" stroke-width="2"/>
    <rect x="730" y="240" width="200" height="32" rx="10" fill="#ef4444"/>
    <rect x="730" y="258" width="200" height="14" fill="#ef4444"/>
    <text x="830" y="262" text-anchor="middle" font-size="14" font-weight="800" fill="white">Review</text>
    <text x="744" y="292" font-size="11" fill="#334155"><tspan font-weight="700">id</tspan> : UUID</text>
    <text x="744" y="310" font-size="11" fill="#64748b">user : FK User</text>
    <text x="744" y="328" font-size="11" fill="#64748b">product : FK Product</text>
    <text x="744" y="346" font-size="11" fill="#334155">rating : int (1-5)</text>
    <text x="744" y="364" font-size="11" fill="#334155">comment : text</text>
  </g>

  <!-- ADDRESS -->
  <g filter="url(#es)">
    <rect x="730" y="410" width="200" height="150" rx="10" fill="white" stroke="#06b6d4" stroke-width="2"/>
    <rect x="730" y="410" width="200" height="32" rx="10" fill="#06b6d4"/>
    <rect x="730" y="428" width="200" height="14" fill="#06b6d4"/>
    <text x="830" y="432" text-anchor="middle" font-size="14" font-weight="800" fill="white">Address</text>
    <text x="744" y="462" font-size="11" fill="#334155"><tspan font-weight="700">id</tspan> : UUID</text>
    <text x="744" y="480" font-size="11" fill="#64748b">user : FK User</text>
    <text x="744" y="498" font-size="11" fill="#334155">label, street, city</text>
    <text x="744" y="516" font-size="11" fill="#334155">country : varchar</text>
    <text x="744" y="534" font-size="11" fill="#3b82f6">lat / lng : decimal</text>
    <text x="744" y="552" font-size="11" fill="#334155">isDefault : boolean</text>
  </g>

  <!-- RELATIONS -->
  <!-- User -> Product (seller) -->
  <line x1="130" y1="270" x2="130" y2="310" stroke="#64748b" stroke-width="2"/>
  <text x="135" y="294" font-size="9" fill="#64748b">1:N seller</text>

  <!-- User -> Order (buyer) -->
  <line x1="230" y1="165" x2="380" y2="148" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="310" y="145" font-size="9" fill="#3b82f6">1:N buyer</text>

  <!-- User -> Order (seller) -->
  <line x1="230" y1="185" x2="380" y2="166" stroke="#10b981" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="310" y="182" font-size="9" fill="#10b981">1:N seller</text>

  <!-- Order -> OrderItem -->
  <line x1="480" y1="330" x2="480" y2="370" stroke="#d97706" stroke-width="2"/>
  <text x="488" y="354" font-size="9" fill="#d97706">1:N</text>

  <!-- Product -> OrderItem -->
  <line x1="230" y1="460" x2="380" y2="458" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="310" y="452" font-size="9" fill="#64748b">1:N</text>

  <!-- Product -> Category -->
  <path d="M230,420 Q680,420 730,130" fill="none" stroke="#8b5cf6" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="490" y="412" font-size="9" fill="#8b5cf6">N:1</text>

  <!-- User -> Review -->
  <path d="M230,200 Q680,200 730,310" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="460" y="207" font-size="9" fill="#ef4444">1:N reviews</text>

  <!-- User -> Address -->
  <path d="M230,240 Q680,300 730,486" fill="none" stroke="#06b6d4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="500" y="310" font-size="9" fill="#06b6d4">1:N</text>

  <!-- Legend -->
  <rect x="30" y="562" width="220" height="12" rx="2"/>
  <text x="40" y="572" font-size="9" fill="#64748b">Toutes les cles primaires sont des UUID v4</text>
</svg>