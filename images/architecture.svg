<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="shadow" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="greenGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <linearGradient id="purpleGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#6d28d9"/>
    </linearGradient>
    <linearGradient id="amberGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="520" rx="16" fill="url(#bgGrad)"/>

  <!-- Title -->
  <text x="450" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Architecture Systeme - TogoMarket</text>

  <!-- CLIENT GROUP -->
  <rect x="30" y="60" width="250" height="190" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="30" y="60" width="250" height="36" rx="14" fill="#eff6ff"/>
  <rect x="30" y="82" width="250" height="14" fill="#eff6ff"/>
  <text x="155" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#1d4ed8">CLIENTS</text>

  <!-- Mobile App -->
  <rect x="50" y="110" width="90" height="120" rx="10" fill="url(#blueGrad)" filter="url(#shadow)"/>
  <rect x="62" y="124" width="66" height="80" rx="4" fill="white" opacity="0.9"/>
  <text x="95" y="155" text-anchor="middle" font-size="8" fill="#334155">React</text>
  <text x="95" y="167" text-anchor="middle" font-size="8" fill="#334155">Native</text>
  <text x="95" y="185" text-anchor="middle" font-size="7" fill="#64748b">Expo</text>
  <circle cx="95" cy="218" r="5" fill="white" opacity="0.6"/>
  <text x="95" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="white">Mobile</text>

  <!-- Web App -->
  <rect x="170" y="110" width="90" height="120" rx="10" fill="url(#purpleGrad)" filter="url(#shadow)"/>
  <rect x="178" y="118" width="74" height="8" rx="2" fill="white" opacity="0.3"/>
  <rect x="182" y="131" width="66" height="73" rx="4" fill="white" opacity="0.9"/>
  <text x="215" y="162" text-anchor="middle" font-size="8" fill="#334155">React 18</text>
  <text x="215" y="174" text-anchor="middle" font-size="8" fill="#334155">Vite</text>
  <text x="215" y="190" text-anchor="middle" font-size="7" fill="#64748b">Tailwind</text>
  <text x="215" y="242" text-anchor="middle" font-size="11" font-weight="700" fill="white">Web</text>

  <!-- BACKEND GROUP -->
  <rect x="330" y="60" width="240" height="390" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="330" y="60" width="240" height="36" rx="14" fill="#f0fdf4"/>
  <rect x="330" y="82" width="240" height="14" fill="#f0fdf4"/>
  <text x="450" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#047857">BACKEND</text>

  <!-- API -->
  <rect x="355" y="108" width="190" height="80" rx="10" fill="url(#greenGrad)" filter="url(#shadow)"/>
  <text x="450" y="138" text-anchor="middle" font-size="14" font-weight="700" fill="white">API Platform 4</text>
  <text x="450" y="158" text-anchor="middle" font-size="11" fill="white" opacity="0.85">Symfony 7 / PHP 8.3</text>
  <text x="450" y="176" text-anchor="middle" font-size="9" fill="white" opacity="0.7">JWT + JSON-LD</text>

  <!-- Database -->
  <ellipse cx="400" cy="235" rx="55" ry="14" fill="#0f172a"/>
  <rect x="345" y="235" width="110" height="45" fill="#1e293b"/>
  <ellipse cx="400" cy="235" rx="55" ry="14" fill="#334155"/>
  <ellipse cx="400" cy="280" rx="55" ry="14" fill="#0f172a"/>
  <text x="400" y="262" text-anchor="middle" font-size="12" font-weight="700" fill="white">PostgreSQL 16</text>

  <!-- Uploads -->
  <rect x="355" y="310" width="190" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="340" font-size="16">&#128193;</text>
  <text x="405" y="340" font-size="12" font-weight="600" fill="#334155">Uploads / VichUploader</text>

  <!-- Doctrine Extensions -->
  <rect x="355" y="375" width="190" height="50" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="380" y="405" font-size="16">&#128274;</text>
  <text x="405" y="405" font-size="12" font-weight="600" fill="#334155">Doctrine Extensions</text>

  <!-- SERVICES GROUP -->
  <rect x="620" y="60" width="250" height="190" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="620" y="60" width="250" height="36" rx="14" fill="#fef3c7"/>
  <rect x="620" y="82" width="250" height="14" fill="#fef3c7"/>
  <text x="745" y="84" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">SERVICES EXTERNES</text>

  <!-- Stripe -->
  <rect x="640" y="108" width="210" height="55" rx="10" fill="url(#amberGrad)" filter="url(#shadow)"/>
  <text x="745" y="133" text-anchor="middle" font-size="13" font-weight="700" fill="white">Stripe Checkout</text>
  <text x="745" y="151" text-anchor="middle" font-size="10" fill="white" opacity="0.85">Paiement securise XOF</text>

  <!-- Mail -->
  <rect x="640" y="176" width="210" height="55" rx="10" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1.5"/>
  <text x="670" y="208" font-size="16">&#128231;</text>
  <text x="745" y="201" text-anchor="middle" font-size="13" font-weight="600" fill="#334155">MailCatcher</text>
  <text x="745" y="219" text-anchor="middle" font-size="10" fill="#64748b">Notifications email</text>

  <!-- ARROWS -->
  <!-- Mobile to API -->
  <line x1="140" y1="170" x2="355" y2="148" stroke="#3b82f6" stroke-width="2.5" stroke-dasharray="6,3"/>
  <polygon points="355,148 345,142 345,154" fill="#3b82f6"/>
  <rect x="210" y="140" width="80" height="20" rx="4" fill="white" stroke="#e2e8f0"/>
  <text x="250" y="154" text-anchor="middle" font-size="9" font-weight="600" fill="#3b82f6">JWT + REST</text>

  <!-- Web to API -->
  <line x1="260" y1="170" x2="355" y2="148" stroke="#8b5cf6" stroke-width="2.5" stroke-dasharray="6,3"/>

  <!-- API to DB -->
  <line x1="450" y1="188" x2="400" y2="221" stroke="#10b981" stroke-width="2"/>
  <polygon points="400,221 394,212 406,212" fill="#10b981"/>

  <!-- API to Stripe -->
  <line x1="545" y1="135" x2="640" y2="135" stroke="#f59e0b" stroke-width="2.5"/>
  <polygon points="640,135 630,129 630,141" fill="#f59e0b"/>

  <!-- Stripe webhook -->
  <line x1="640" y1="150" x2="545" y2="150" stroke="#f59e0b" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="545,150 555,144 555,156" fill="#f59e0b"/>
  <rect x="566" y="140" width="62" height="18" rx="4" fill="#fef3c7"/>
  <text x="597" y="153" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">Webhook</text>

  <!-- API to Mail -->
  <line x1="545" y1="165" x2="640" y2="200" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5,3"/>
  <polygon points="640,200 630,194 632,205" fill="#64748b"/>

  <!-- FOOTER - Docker -->
  <rect x="30" y="470" width="840" height="40" rx="10" fill="#0f172a"/>
  <text x="450" y="495" text-anchor="middle" font-size="12" font-weight="600" fill="white">Docker : PHP-FPM  |  Nginx  |  PostgreSQL 16  |  Node 20  |  MailCatcher</text>
</svg>