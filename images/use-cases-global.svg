<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="sh" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.07"/>
    </filter>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#faf5ff"/>
    </linearGradient>
  </defs>

  <rect width="960" height="620" rx="16" fill="url(#bg2)"/>
  <text x="480" y="38" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Diagramme des Cas d'Utilisation</text>

  <!-- VISITEUR -->
