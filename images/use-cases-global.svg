    <text x="735" y="480" text-anchor="middle" font-size="11" fill="#334155">Valider les vendeurs</text>
    <line x1="884" y1="445" x2="840" y2="475" stroke="#f59e0b" stroke-width="1.2"/>
  </g>
  <g filter="url(#sh)">
    <rect x="630" y="502" width="210" height="34" rx="17" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
    <text x="735" y="524" text-anchor="middle" font-size="11" font-weight="600" fill="#dc2626">Marquer commande payee</text>
    <line x1="884" y1="460" x2="840" y2="519" stroke="#f59e0b" stroke-width="1.2"/>
  </g>

  <!-- System boundary -->
  <rect x="100" y="55" width="510" height="530" rx="16" fill="none" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="8,4"/>
  <text x="355" y="575" text-anchor="middle" font-size="10" fill="#94a3b8" font-weight="600">SYSTEME TOGOMARKET</text>
</svg>