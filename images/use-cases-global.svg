  <line x1="900" y1="480" x2="882" y2="506" stroke="#d97706" stroke-width="2"/>
  <line x1="900" y1="480" x2="918" y2="506" stroke="#d97706" stroke-width="2"/>
  <text x="900" y="524" text-anchor="middle" font-size="11" font-weight="700" fill="#b45309">Admin</text>
