    <text x="195" y="134" text-anchor="middle" font-size="11" fill="#334155">Rechercher / filtrer</text>
    <line x1="80" y1="140" x2="110" y2="129" stroke="#94a3b8" stroke-width="1.2"/>
  </g>
  <g filter="url(#sh)">
    <rect x="110" y="156" width="170" height="34" rx="17" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="195" y="178" text-anchor="middle" font-size="11" fill="#334155">Voir detail produit</text>
