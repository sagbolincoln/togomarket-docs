  <circle cx="60" cy="130" r="16" fill="#94a3b8" stroke="#64748b" stroke-width="2"/>
  <line x1="60" y1="146" x2="60" y2="180" stroke="#64748b" stroke-width="2"/>
  <line x1="40" y1="160" x2="80" y2="160" stroke="#64748b" stroke-width="2"/>
  <line x1="60" y1="180" x2="42" y2="206" stroke="#64748b" stroke-width="2"/>
  <line x1="60" y1="180" x2="78" y2="206" stroke="#64748b" stroke-width="2"/>
  <text x="60" y="224" text-anchor="middle" font-size="11" font-weight="700" fill="#475569">Visiteur</text>

  <!-- Visiteur use cases -->
  <g filter="url(#sh)">
    <rect x="110" y="68" width="170" height="34" rx="17" fill="white" stroke="#94a3b8" stroke-width="1.5"/>
    <text x="195" y="90" text-anchor="middle" font-size="11" fill="#334155">Consulter les produits</text>
    <line x1="80" y1="130" x2="110" y2="85" stroke="#94a3b8" stroke-width="1.2"/>
  </g>
  <g filter="url(#sh)">
