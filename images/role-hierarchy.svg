<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="rs" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="rbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#eff6ff"/>
    </linearGradient>
  </defs>

  <rect width="600" height="400" rx="16" fill="url(#rbg)"/>
  <text x="300" y="36" text-anchor="middle" font-size="18" font-weight="800" fill="#0f172a">Hierarchie des Roles</text>

  <!-- ADMIN -->
  <rect x="190" y="60" width="220" height="80" rx="14" fill="white" stroke="#f59e0b" stroke-width="2.5" filter="url(#rs)"/>
  <circle cx="230" cy="100" r="22" fill="#fef3c7"/>
  <text x="230" y="106" text-anchor="middle" font-size="20">&#128737;</text>
  <text x="330" y="92" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Administrateur</text>
  <text x="330" y="112" text-anchor="middle" font-size="11" fill="#b45309" font-weight="600">ROLE_ADMIN</text>
  <rect x="285" y="120" width="90" height="14" rx="4" fill="#fef3c7"/>
  <text x="330" y="131" text-anchor="middle" font-size="8" font-weight="600" fill="#b45309">Acces complet</text>

  <!-- Arrow Admin -> Seller -->
  <line x1="300" y1="140" x2="300" y2="168" stroke="#475569" stroke-width="2"/>
  <polygon points="300,168 294,158 306,158" fill="#475569"/>
  <text x="318" y="158" font-size="9" fill="#64748b">herite de</text>

  <!-- SELLER -->
  <rect x="190" y="170" width="220" height="80" rx="14" fill="white" stroke="#10b981" stroke-width="2.5" filter="url(#rs)"/>
  <circle cx="230" cy="210" r="22" fill="#d1fae5"/>
  <text x="230" y="216" text-anchor="middle" font-size="20">&#127978;</text>
  <text x="330" y="202" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Vendeur</text>
  <text x="330" y="222" text-anchor="middle" font-size="11" fill="#047857" font-weight="600">ROLE_SELLER</text>
  <rect x="270" y="230" width="120" height="14" rx="4" fill="#d1fae5"/>
  <text x="330" y="241" text-anchor="middle" font-size="8" font-weight="600" fill="#047857">Gestion boutique</text>

  <!-- Arrow Seller -> Buyer -->
  <line x1="300" y1="250" x2="300" y2="278" stroke="#475569" stroke-width="2"/>
  <polygon points="300,278 294,268 306,268" fill="#475569"/>
  <text x="318" y="268" font-size="9" fill="#64748b">herite de</text>

  <!-- BUYER -->
  <rect x="190" y="280" width="220" height="80" rx="14" fill="white" stroke="#3b82f6" stroke-width="2.5" filter="url(#rs)"/>
  <circle cx="230" cy="320" r="22" fill="#dbeafe"/>
  <text x="230" y="326" text-anchor="middle" font-size="20">&#128722;</text>
  <text x="330" y="312" text-anchor="middle" font-size="16" font-weight="800" fill="#0f172a">Acheteur</text>
  <text x="330" y="332" text-anchor="middle" font-size="11" fill="#1d4ed8" font-weight="600">ROLE_BUYER</text>
  <rect x="268" y="340" width="125" height="14" rx="4" fill="#dbeafe"/>
  <text x="330" y="351" text-anchor="middle" font-size="8" font-weight="600" fill="#1d4ed8">Panier + Commandes</text>

  <!-- Side permissions -->
  <!-- Admin perms -->
  <rect x="430" y="68" width="155" height="64" rx="8" fill="#fef3c7" stroke="#fde68a" filter="url(#rs)"/>
  <text x="440" y="86" font-size="9" fill="#92400e">&#10003; Stats globales</text>
  <text x="440" y="100" font-size="9" fill="#92400e">&#10003; Gestion utilisateurs</text>
  <text x="440" y="114" font-size="9" fill="#92400e">&#10003; Validation vendeurs</text>
  <text x="440" y="128" font-size="9" fill="#92400e">&#10003; Marquer commande payee</text>

  <!-- Seller perms -->
  <rect x="430" y="178" width="155" height="64" rx="8" fill="#d1fae5" stroke="#a7f3d0" filter="url(#rs)"/>
  <text x="440" y="196" font-size="9" fill="#065f46">&#10003; Publier des produits</text>
  <text x="440" y="210" font-size="9" fill="#065f46">&#10003; Gerer couleurs/tailles</text>
  <text x="440" y="224" font-size="9" fill="#065f46">&#10003; Traiter les commandes</text>
  <text x="440" y="238" font-size="9" fill="#065f46">&#10003; Confirmer livraison</text>

  <!-- Buyer perms -->
  <rect x="430" y="288" width="155" height="64" rx="8" fill="#dbeafe" stroke="#bfdbfe" filter="url(#rs)"/>
  <text x="440" y="306" font-size="9" fill="#1e40af">&#10003; Ajouter au panier</text>
  <text x="440" y="320" font-size="9" fill="#1e40af">&#10003; Passer commande</text>
  <text x="440" y="334" font-size="9" fill="#1e40af">&#10003; Gerer adresses + GPS</text>
  <text x="440" y="348" font-size="9" fill="#1e40af">&#10003; Voir code de livraison</text>

  <!-- Visitor -->
  <rect x="15" y="178" width="155" height="64" rx="8" fill="#f1f5f9" stroke="#e2e8f0" filter="url(#rs)"/>
  <text x="92" y="194" text-anchor="middle" font-size="10" font-weight="700" fill="#475569">Visiteur</text>
  <text x="25" y="212" font-size="9" fill="#64748b">&#10003; Consulter produits</text>
  <text x="25" y="226" font-size="9" fill="#64748b">&#10003; Rechercher / Filtrer</text>
  <text x="25" y="240" font-size="9" fill="#64748b">&#10003; S'inscrire</text>

  <!-- Connecting lines -->
  <line x1="410" y1="100" x2="430" y2="100" stroke="#fde68a" stroke-width="1.5"/>
  <line x1="410" y1="210" x2="430" y2="210" stroke="#a7f3d0" stroke-width="1.5"/>
  <line x1="410" y1="320" x2="430" y2="320" stroke="#bfdbfe" stroke-width="1.5"/>
  <line x1="170" y1="210" x2="190" y2="210" stroke="#e2e8f0" stroke-width="1.5" stroke-dasharray="4,3"/>
</svg>