<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="sd" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity="0.1"/>
    </filter>
  </defs>

  <rect width="900" height="340" rx="16" fill="#f8fafc"/>
  <text x="450" y="34" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Cycle de Vie d'une Commande</text>

  <!-- Start -->
  <circle cx="50" cy="160" r="14" fill="#0f172a"/>
  <circle cx="50" cy="160" r="8" fill="#0f172a" stroke="white" stroke-width="2"/>

  <!-- Arrow to pending -->
  <line x1="64" y1="160" x2="100" y2="160" stroke="#475569" stroke-width="2"/>
  <polygon points="100,160 92,155 92,165" fill="#475569"/>

  <!-- PENDING -->
  <rect x="100" y="130" width="130" height="60" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2" filter="url(#sd)"/>
  <circle cx="125" cy="155" r="6" fill="#94a3b8"/>
  <text x="170" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#475569">Pending</text>
  <text x="165" y="175" text-anchor="middle" font-size="9" fill="#94a3b8">En attente</text>

  <!-- Arrow to paid -->
  <line x1="230" y1="160" x2="280" y2="160" stroke="#475569" stroke-width="2"/>
  <polygon points="280,160 272,155 272,165" fill="#475569"/>
  <rect x="230" y="137" width="50" height="16" rx="3" fill="white"/>
  <text x="255" y="149" text-anchor="middle" font-size="8" fill="#64748b">Stripe/</text>
  <text x="255" y="159" text-anchor="middle" font-size="8" fill="#64748b">Admin</text>

  <!-- PAID -->
  <rect x="280" y="130" width="130" height="60" rx="12" fill="#dbeafe" stroke="#3b82f6" stroke-width="2" filter="url(#sd)"/>
  <circle cx="305" cy="155" r="6" fill="#3b82f6"/>
  <text x="350" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#1d4ed8">Paid</text>
  <text x="345" y="175" text-anchor="middle" font-size="9" fill="#3b82f6">Payee</text>

  <!-- Arrow to processing -->
  <line x1="410" y1="160" x2="460" y2="160" stroke="#475569" stroke-width="2"/>
  <polygon points="460,160 452,155 452,165" fill="#475569"/>
  <text x="435" y="150" text-anchor="middle" font-size="8" fill="#64748b">Vendeur</text>

  <!-- PROCESSING -->
  <rect x="460" y="130" width="130" height="60" rx="12" fill="#fef3c7" stroke="#f59e0b" stroke-width="2" filter="url(#sd)"/>
  <circle cx="485" cy="155" r="6" fill="#f59e0b"/>
  <text x="530" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#b45309">Processing</text>
  <text x="525" y="175" text-anchor="middle" font-size="9" fill="#d97706">En preparation</text>

  <!-- Arrow to shipped -->
  <line x1="590" y1="160" x2="640" y2="160" stroke="#475569" stroke-width="2"/>
  <polygon points="640,160 632,155 632,165" fill="#475569"/>
  <text x="615" y="150" text-anchor="middle" font-size="8" fill="#64748b">Vendeur</text>

  <!-- SHIPPED -->
  <rect x="640" y="130" width="130" height="60" rx="12" fill="#ede9fe" stroke="#8b5cf6" stroke-width="2" filter="url(#sd)"/>
  <circle cx="665" cy="155" r="6" fill="#8b5cf6"/>
  <text x="710" y="157" text-anchor="middle" font-size="14" font-weight="700" fill="#6d28d9">Shipped</text>
  <text x="705" y="175" text-anchor="middle" font-size="9" fill="#7c3aed">Expediee</text>

  <!-- Delivery code badge on shipped -->
  <rect x="660" y="195" width="90" height="20" rx="10" fill="#fef3c7" stroke="#f59e0b" stroke-width="1"/>
  <text x="705" y="209" text-anchor="middle" font-size="9" font-weight="700" fill="#b45309">Code 6 chiffres</text>

  <!-- Arrow to delivered -->
  <path d="M770,160 Q810,160 810,200 Q810,260 750,260" fill="none" stroke="#475569" stroke-width="2"/>
  <polygon points="750,260 758,255 758,265" fill="#475569"/>
  <text x="828" y="210" font-size="8" fill="#64748b">Vendeur</text>
  <text x="828" y="220" font-size="8" fill="#64748b">+ Code</text>

  <!-- DELIVERED -->
  <rect x="610" y="235" width="140" height="60" rx="12" fill="#d1fae5" stroke="#10b981" stroke-width="2.5" filter="url(#sd)"/>
  <circle cx="637" cy="260" r="8" fill="#10b981"/>
  <text x="637" y="264" text-anchor="middle" font-size="10" font-weight="800" fill="white">&#10003;</text>
  <text x="693" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#047857">Delivered</text>
  <text x="680" y="280" text-anchor="middle" font-size="9" fill="#10b981">Livree</text>

  <!-- End circle -->
  <circle cx="790" cy="265" r="14" fill="#0f172a"/>
  <circle cx="790" cy="265" r="8" fill="#0f172a" stroke="white" stroke-width="2"/>
  <line x1="750" y1="265" x2="776" y2="265" stroke="#0f172a" stroke-width="2"/>
  <polygon points="776,265 768,260 768,270" fill="#0f172a"/>

  <!-- CANCELLED branch -->
  <path d="M165,190 Q165,265 220,265" fill="none" stroke="#ef4444" stroke-width="2" stroke-dasharray="5,3"/>
  <polygon points="220,265 212,260 212,270" fill="#ef4444"/>
  <rect x="220" y="240" width="120" height="50" rx="12" fill="#fee2e2" stroke="#ef4444" stroke-width="2" filter="url(#sd)"/>
  <text x="280" y="262" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">Cancelled</text>
  <text x="280" y="278" text-anchor="middle" font-size="9" fill="#ef4444">Annulee</text>

  <!-- End from cancelled -->
  <circle cx="390" cy="265" r="14" fill="#0f172a"/>
  <circle cx="390" cy="265" r="8" fill="#0f172a" stroke="white" stroke-width="2"/>
  <line x1="340" y1="265" x2="376" y2="265" stroke="#0f172a" stroke-width="2"/>
  <polygon points="376,265 368,260 368,270" fill="#0f172a"/>
</svg>