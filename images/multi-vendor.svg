<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif">
  <defs>
    <filter id="sv" x="-3%" y="-3%" width="106%" height="110%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.07"/>
    </filter>
  </defs>

  <rect width="900" height="500" rx="16" fill="#f8fafc"/>
  <text x="450" y="36" text-anchor="middle" font-size="20" font-weight="800" fill="#0f172a">Commande Multi-Vendeurs : 1 Paiement, N Livraisons</text>

  <!-- STEP 1: Cart -->
  <rect x="30" y="60" width="250" height="180" rx="14" fill="white" stroke="#e2e8f0" stroke-width="1.5" filter="url(#sv)"/>
  <rect x="30" y="60" width="250" height="36" rx="14" fill="#eff6ff"/>
  <rect x="30" y="82" width="250" height="14" fill="#eff6ff"/>
  <text x="46" y="82" font-size="18">&#128722;</text>
  <text x="155" y="84" text-anchor="middle" font-size="12" font-weight="700" fill="#1d4ed8">Panier de Sophie</text>

  <!-- Item 1 -->
  <rect x="45" y="108" width="220" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="55" y="116" width="34" height="34" rx="6" fill="#dbeafe"/>
  <text x="72" y="139" text-anchor="middle" font-size="16">&#128241;</text>
  <text x="102" y="132" font-size="12" font-weight="700" fill="#334155">iPhone 15</text>
  <text x="102" y="148" font-size="10" fill="#64748b">TechLome (Kofi)</text>
  <text x="244" y="138" text-anchor="end" font-size="12" font-weight="800" fill="#1d4ed8">650 000 F</text>

  <!-- Item 2 -->
  <rect x="45" y="168" width="220" height="50" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <rect x="55" y="176" width="34" height="34" rx="6" fill="#fce7f3"/>
  <text x="72" y="199" text-anchor="middle" font-size="16">&#128087;</text>
  <text x="102" y="192" font-size="12" font-weight="700" fill="#334155">Robe Ankara</text>
  <text x="102" y="208" font-size="10" fill="#64748b">AfroStyle (Ama)</text>
  <text x="244" y="198" text-anchor="end" font-size="12" font-weight="800" fill="#1d4ed8">25 000 F</text>

  <!-- STEP 2: One payment -->
  <rect x="320" y="80" width="260" height="80" rx="14" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#sv)"/>
  <rect x="320" y="80" width="260" height="34" rx="14" fill="#fef3c7"/>
  <rect x="320" y="100" width="260" height="14" fill="#fef3c7"/>
  <text x="336" y="101" font-size="16">&#128179;</text>
  <text x="450" y="103" text-anchor="middle" font-size="12" font-weight="700" fill="#b45309">1 seul paiement Stripe</text>
  <text x="450" y="137" text-anchor="middle" font-size="22" font-weight="800" fill="#0f172a">675 000 FCFA</text>

  <!-- Arrow cart to payment -->
  <line x1="280" y1="140" x2="320" y2="120" stroke="#475569" stroke-width="2"/>
  <polygon points="320,120 310,118 314,127" fill="#475569"/>

  <!-- STEP 3: Split -->
  <rect x="630" y="60" width="240" height="44" rx="10" fill="#0f172a" filter="url(#sv)"/>
  <text x="750" y="77" text-anchor="middle" font-size="11" font-weight="700" fill="#f59e0b">SPLIT AUTOMATIQUE</text>
  <text x="750" y="94" text-anchor="middle" font-size="10" fill="#94a3b8">par vendeur</text>

  <!-- Arrow to split -->
  <line x1="580" y1="105" x2="630" y2="82" stroke="#475569" stroke-width="2"/>
  <polygon points="630,82 621,82 624,91" fill="#475569"/>

  <!-- Order 1: Kofi -->
  <rect x="620" y="120" width="260" height="150" rx="14" fill="white" stroke="#10b981" stroke-width="2" filter="url(#sv)"/>
  <rect x="620" y="120" width="260" height="34" rx="14" fill="#d1fae5"/>
  <rect x="620" y="140" width="260" height="14" fill="#d1fae5"/>
  <text x="750" y="142" text-anchor="middle" font-size="12" font-weight="700" fill="#047857">Commande #1 - Kofi (TechLome)</text>

  <text x="640" y="175" font-size="11" fill="#334155">&#128241; iPhone 15</text>
  <text x="855" y="175" text-anchor="end" font-size="11" font-weight="700" fill="#334155">650 000 F</text>

  <line x1="640" y1="188" x2="860" y2="188" stroke="#e2e8f0"/>

  <!-- Status stepper for order 1 -->
  <circle cx="658" cy="210" r="8" fill="#10b981"/><text x="658" y="214" text-anchor="middle" font-size="8" font-weight="800" fill="white">&#10003;</text>
  <line x1="666" y1="210" x2="698" y2="210" stroke="#10b981" stroke-width="2"/>
  <circle cx="706" cy="210" r="8" fill="#10b981"/><text x="706" y="214" text-anchor="middle" font-size="8" font-weight="800" fill="white">&#10003;</text>
  <line x1="714" y1="210" x2="746" y2="210" stroke="#10b981" stroke-width="2"/>
  <circle cx="754" cy="210" r="8" fill="#8b5cf6"/>
  <line x1="762" y1="210" x2="794" y2="210" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="802" cy="210" r="8" fill="#e2e8f0"/>
  <line x1="810" y1="210" x2="842" y2="210" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="850" cy="210" r="8" fill="#e2e8f0"/>

  <text x="658" y="232" text-anchor="middle" font-size="7" fill="#64748b">Paid</text>
  <text x="706" y="232" text-anchor="middle" font-size="7" fill="#64748b">Prep.</text>
  <text x="754" y="232" text-anchor="middle" font-size="7" font-weight="700" fill="#6d28d9">Ship.</text>
  <text x="802" y="232" text-anchor="middle" font-size="7" fill="#94a3b8">Deliv.</text>

  <!-- Code -->
  <rect x="640" y="242" width="120" height="22" rx="6" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="700" y="257" text-anchor="middle" font-size="10" font-weight="700" fill="#b45309">Code: 384721</text>

  <!-- Order 2: Ama -->
  <rect x="620" y="290" width="260" height="150" rx="14" fill="white" stroke="#e879f9" stroke-width="2" filter="url(#sv)"/>
  <rect x="620" y="290" width="260" height="34" rx="14" fill="#fae8ff"/>
  <rect x="620" y="310" width="260" height="14" fill="#fae8ff"/>
  <text x="750" y="312" text-anchor="middle" font-size="12" font-weight="700" fill="#a21caf">Commande #2 - Ama (AfroStyle)</text>

  <text x="640" y="345" font-size="11" fill="#334155">&#128087; Robe Ankara</text>
  <text x="855" y="345" text-anchor="end" font-size="11" font-weight="700" fill="#334155">25 000 F</text>

  <line x1="640" y1="358" x2="860" y2="358" stroke="#e2e8f0"/>

  <!-- Status stepper for order 2 -->
  <circle cx="658" cy="380" r="8" fill="#10b981"/><text x="658" y="384" text-anchor="middle" font-size="8" font-weight="800" fill="white">&#10003;</text>
  <line x1="666" y1="380" x2="698" y2="380" stroke="#10b981" stroke-width="2"/>
  <circle cx="706" cy="380" r="8" fill="#f59e0b"/>
  <line x1="714" y1="380" x2="746" y2="380" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="754" cy="380" r="8" fill="#e2e8f0"/>
  <line x1="762" y1="380" x2="794" y2="380" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="802" cy="380" r="8" fill="#e2e8f0"/>
  <line x1="810" y1="380" x2="842" y2="380" stroke="#e2e8f0" stroke-width="2"/>
  <circle cx="850" cy="380" r="8" fill="#e2e8f0"/>

  <text x="658" y="402" text-anchor="middle" font-size="7" fill="#64748b">Paid</text>
  <text x="706" y="402" text-anchor="middle" font-size="7" font-weight="700" fill="#b45309">Prep.</text>
  <text x="754" y="402" text-anchor="middle" font-size="7" fill="#94a3b8">Ship.</text>
  <text x="802" y="402" text-anchor="middle" font-size="7" fill="#94a3b8">Deliv.</text>

  <!-- Note -->
  <rect x="640" y="414" width="200" height="20" rx="6" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="740" y="428" text-anchor="middle" font-size="9" fill="#1d4ed8">En preparation... livre plus tard</text>

  <!-- Arrow split to orders -->
  <line x1="720" y1="104" x2="720" y2="120" stroke="#475569" stroke-width="2"/>
  <polygon points="720,120 715,112 725,112" fill="#475569"/>

  <!-- Info box bottom left -->
  <rect x="30" y="280" width="250" height="100" rx="12" fill="white" stroke="#e2e8f0" filter="url(#sv)"/>
  <rect x="45" y="296" width="220" height="24" rx="6" fill="#d1fae5"/>
  <text x="155" y="312" text-anchor="middle" font-size="10" font-weight="700" fill="#047857">Avantages pour l'acheteur</text>
  <text x="55" y="340" font-size="11" fill="#334155">&#10003; 1 seul paiement</text>
  <text x="55" y="358" font-size="11" fill="#334155">&#10003; Suivi independant par vendeur</text>
  <text x="55" y="376" font-size="11" fill="#334155">&#10003; Code de livraison unique</text>

  <!-- Arrows from payment to split -->
  <rect x="330" y="180" width="240" height="50" rx="10" fill="white" stroke="#e2e8f0" filter="url(#sv)"/>
  <text x="450" y="200" text-anchor="middle" font-size="11" font-weight="700" fill="#0f172a">Webhook Stripe confirme</text>
  <text x="450" y="218" text-anchor="middle" font-size="10" fill="#64748b">2 commandes passent en "paid"</text>

  <line x1="450" y1="160" x2="450" y2="180" stroke="#f59e0b" stroke-width="2"/>
  <polygon points="450,180 445,172 455,172" fill="#f59e0b"/>
  <line x1="570" y1="205" x2="620" y2="195" stroke="#475569" stroke-width="1.5"/>
  <polygon points="620,195 611,193 614,201" fill="#475569"/>
  <line x1="570" y1="205" x2="620" y2="355" stroke="#475569" stroke-width="1.5"/>
  <polygon points="620,355 611,351 615,358" fill="#475569"/>
</svg>