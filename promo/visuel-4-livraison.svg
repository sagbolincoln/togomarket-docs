<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="50%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#4338ca"/>
    </linearGradient>
  </defs>
  <!-- Background -->
  <rect width="1080" height="1080" fill="url(#bg)"/>
  <!-- Decorative -->
  <circle cx="540" cy="540" r="500" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="100"/>
  <circle cx="540" cy="540" r="350" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="80"/>
  <!-- Truck icon -->
  <g transform="translate(420, 140) scale(4)">
    <rect x="2" y="20" width="38" height="24" rx="3" fill="none" stroke="#fff" stroke-width="2.5"/>
    <rect x="40" y="28" width="16" height="16" rx="2" fill="none" stroke="#fff" stroke-width="2.5"/>
    <circle cx="14" cy="48" r="5" fill="none" stroke="#fff" stroke-width="2.5"/>
    <circle cx="48" cy="48" r="5" fill="none" stroke="#fff" stroke-width="2.5"/>
    <line x1="40" y1="34" x2="48" y2="34" stroke="#fff" stroke-width="2.5"/>
  </g>
  <!-- Main text -->
  <text x="540" y="460" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="900" fill="#fff">Livraison</text>
  <text x="540" y="540" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="68" font-weight="900" fill="rgba(255,255,255,0.3)">partout a Lome</text>
  <!-- Steps -->
  <g transform="translate(100, 610)">
    <!-- Step 1 -->
    <circle cx="120" cy="40" r="36" fill="rgba(255,255,255,0.15)"/>
    <text x="120" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#fff">1</text>
    <text x="120" y="100" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff">Commandez</text>
    <text x="120" y="125" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">Choisissez vos</text>
    <text x="120" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">produits preferes</text>
    <!-- Line -->
    <line x1="180" y1="40" x2="320" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="8,4"/>
    <!-- Step 2 -->
    <circle cx="440" cy="40" r="36" fill="rgba(255,255,255,0.15)"/>
    <text x="440" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#fff">2</text>
    <text x="440" y="100" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff">Payez</text>
    <text x="440" y="125" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">TMoney, Flooz</text>
    <text x="440" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">ou carte bancaire</text>
    <!-- Line -->
    <line x1="500" y1="40" x2="640" y2="40" stroke="rgba(255,255,255,0.2)" stroke-width="2" stroke-dasharray="8,4"/>
    <!-- Step 3 -->
    <circle cx="760" cy="40" r="36" fill="#10b981"/>
    <text x="760" y="48" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="28" font-weight="800" fill="#fff">3</text>
    <text x="760" y="100" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="18" font-weight="600" fill="#fff">Recevez</text>
    <text x="760" y="125" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">Livraison rapide</text>
    <text x="760" y="145" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="14" fill="rgba(255,255,255,0.6)">avec code securise</text>
  </g>
  <!-- CTA -->
  <rect x="330" y="870" width="420" height="70" rx="16" fill="#fff"/>
  <text x="540" y="914" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="22" font-weight="700" fill="#4338ca">Decouvrir TogoMarket</text>
  <!-- Footer -->
  <text x="540" y="1010" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-size="16" fill="rgba(255,255,255,0.4)">togomarket.tg · Livraison securisee avec code de confirmation</text>
</svg>
